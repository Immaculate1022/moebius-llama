name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-no-torch:
    # The public API must stay importable without torch installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --no-deps -e . && pip install pytest
      - run: pytest tests/test_import_without_torch.py -v

  test-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only torch first so pip does not pull the CUDA build
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e . && pip install pytest
      - run: pytest -v
